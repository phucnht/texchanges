version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    target-branch: develop
    groups:
      astro:
        patterns:
          - astro
          - '@astrojs/*'
    ignore:
      # TypeScript 7's native compiler does not expose the programmatic API
      # that `astro check` needs. Track https://github.com/withastro/roadmap/discussions/1321
      # and drop this entry once Astro supports it.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
